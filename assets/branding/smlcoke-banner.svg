    <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#b9f5dc"/><stop offset="1" stop-color="#71c9c0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="358" rx="26" fill="url(#background)" stroke="#314653"/>
